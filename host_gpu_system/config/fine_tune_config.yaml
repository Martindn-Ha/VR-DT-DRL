sampling:
  weak_ratio: 0.7
  normal_ratio: 0.3

training:
  learning_rate: 1.0e-4
  batch_size: 16
  checkpoint_every_steps: 100

checkpoints:
  base_r1: models/ur3_live_model_r1.pth
  base_r2: models/ur3_live_model_r2.pth
  save_r1: models/R1_BC_targeted_70weak_30normal.pth
  save_r2: models/R2_BC_targeted_70weak_30normal.pth

collection:
  weak_spawn_probability: 0.7

weak_regions:
  1:
    - {phase: 4, quadrant: 4}
  2:
    - {phase: 3, quadrant: 3}
    - {phase: 3, quadrant: 4}
    - {phase: 4, quadrant: 1}
    - {phase: 4, quadrant: 3}
    - {phase: 4, quadrant: 4}
