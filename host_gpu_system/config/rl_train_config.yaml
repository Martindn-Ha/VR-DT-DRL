# Minimal dynamics experiment (2026-06): LR 1e-4, noise anneal, gated align, skip clamp buffer.
training:
  batch_size: 16
  checkpoint_every_steps: 100
  buffer_capacity: 10000
  skip_buffer_when_clamp_limited: true

checkpoints:
  save_r1: models/R1_RL_residual.pth
  save_r2: models/R2_RL_residual.pth

robots:
  1:
    max_delta_x_m: 0.03
    max_delta_z_m: 0.03
    max_delta_yaw_rad: 0.17
    td3:
      learning_rate: 1.0e-4
      gamma: 0.99
      tau: 0.005
      policy_noise: 0.05
      noise_clip: 0.12
      policy_delay: 2
      exploration_noise: 0.025
      exploration_noise_schedule:
        - until_session_episode: 20
          scale: 0.025
        - until_session_episode: 40
          scale: 0.01
        - until_session_episode: 999999
          scale: 0.0
    reward:
      w_success: 1.0
      w_dist: 0.0
      w_align: 0.20
      align_scale_m: 0.02
      align_max_closest_dist_m: 0.08
      align_require_progress: true
      w_lift: 0.45
      w_drop: 0.25
      w_clamp: 0.05
      w_corr: 0.60
      w_miss: 0.15
      lift_progress_min_m: 0.005
      w_corr_fail_mult: 2.5
      w_delta_sat: 0.30
      delta_sat_ratio: 0.70
      lift_target_m: 0.023

  2:
    max_delta_x_m: 0.04
    max_delta_z_m: 0.04
    max_delta_yaw_rad: 0.20
    td3:
      learning_rate: 1.0e-4
      gamma: 0.99
      tau: 0.005
      policy_noise: 0.05
      noise_clip: 0.12
      policy_delay: 2
      exploration_noise: 0.025
      exploration_noise_schedule:
        - until_session_episode: 20
          scale: 0.025
        - until_session_episode: 40
          scale: 0.01
        - until_session_episode: 999999
          scale: 0.0
    reward:
      w_success: 1.0
      w_dist: 0.0
      w_align: 0.20
      align_scale_m: 0.02
      align_max_closest_dist_m: 0.08
      align_require_progress: true
      w_lift: 0.35
      w_drop: 0.20
      w_clamp: 0.20
      w_corr: 0.60
      w_miss: 0.15
      lift_progress_min_m: 0.005
      w_corr_fail_mult: 2.5
      w_delta_sat: 0.30
      delta_sat_ratio: 0.70
      lift_target_m: 0.023
