#VRML_SIM R2021a utf8

PROTO CurvedPlatform [
  field SFVec3f    translation -1.231 0.44 0.74065
  field SFRotation rotation    0 1 0 -1.5708
  field SFString   name        "platform"
  field SFColor    color       0.2 0.8 0.4
  field SFFloat    mass        1.0
]
{
  Solid {
    translation IS translation
    rotation IS rotation
    name IS name
    
    # 1. VISUALS
    children [
      DEF PLATFORM_SHAPE Shape {
        appearance PBRAppearance {
          baseColor IS color
          roughness 0.5
          metalness 0.1
        }
        geometry Extrusion {
          # The custom 2D shape with a pure circular arc
          crossSection [
            0 0          # Bottom-left corner (origin)
            0.3 0        # Bottom-right corner (end of 30 cm bottom line)
            
            # True convex circular arc (Radius = 48.7 cm)
            0.3000 0.1050  # Top of the 10.5 cm right line
            0.2800 0.1180
            0.2600 0.1297
            0.2400 0.1401
            0.2200 0.1495
            0.2000 0.1578
            0.1800 0.1650
            0.1600 0.1713
            0.1400 0.1766
            0.1200 0.1811
            0.1000 0.1847
            0.0800 0.1874
            0.0600 0.1892
            0.0400 0.1904
            0.0200 0.1906  # The peak of the circular bulge
            0.0000 0.1900  # Top of the 19 cm left line
            
            0 0          # Back to the origin to close the shape
          ]
          # The 3D thickness (0.005 meters / 5 mm)
          spine [
            0 0 0
            0 0.005 0        
          ]
        }
      }
    ]
    
    # 2. COLLISIONS
    boundingObject USE PLATFORM_SHAPE
    
  }
}
